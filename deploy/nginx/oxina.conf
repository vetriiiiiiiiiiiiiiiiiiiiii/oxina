# /etc/nginx/sites-available/oxina  (symlink into sites-enabled)
# Replace ops.example.com with your domain. Certificates are issued by certbot (see docs/DEPLOYMENT.md).

limit_req_zone $binary_remote_addr zone=oxina_auth:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name ops.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ops.example.com;

    ssl_certificate     /etc/letsencrypt/live/ops.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ops.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    client_max_body_size 12m;   # uploads are capped at 10 MB in the app
    server_tokens off;

    access_log /var/log/nginx/oxina.access.log;
    error_log  /var/log/nginx/oxina.error.log warn;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Overwrite (not append) so clients cannot spoof their IP for rate limiting / audit.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;

    location = /api/auth/login {
        limit_req zone=oxina_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }

    # Server-Sent Events for live service tracking: no buffering, long-lived.
    location ~ ^/api/service/jobs/[^/]+/stream$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_set_header Connection "";
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_read_timeout 60s;
    }
}
